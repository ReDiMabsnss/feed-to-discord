# Quellen fuer den News-Bot.
# webhook:      Name des GitHub-Secrets mit der Discord-Webhook-URL
# max_per_run:  Obergrenze pro Lauf (Standard 4)
# max_age_days: Aelteres wird ignoriert (Standard 14)
# keywords:     nur Eintraege, die eines dieser Worte als eigenstaendiges
#               Wort enthalten (Wortgrenzen, angehaengtes s erlaubt)
# fetch_full:   Artikelseite nachladen, wenn der Feed kaum Text liefert

# Wiederverwendbare Stichwortliste fuer die breiten Security-Feeds, die
# nicht schwerpunktmaessig ueber KI schreiben. Als YAML-Anker abgelegt und
# weiter unten mit *ai_security referenziert. Das Skript liest nur den
# Schluessel "feeds", dieser Block stoert es nicht.
ai_security: &ai_security
  - KI
  - AI
  - LLM
  - GenAI
  - agentic
  - prompt injection
  - jailbreak
  - machine learning
  - neural network
  - chatbot
  - Copilot
  - ChatGPT
  - Claude
  - Gemini
  - OpenAI
  - Anthropic
  - deepfake
  - MCP

feeds:
  # ---------- allgemein ----------
  - name: OpenAI News
    url: https://openai.com/news/rss.xml
    webhook: DISCORD_WEBHOOK_ALLGEMEIN

  # Anthropic hat keinen offiziellen Feed. Das hier ist ein Community-Spiegel
  # und kann jederzeit verschwinden. Faellt er aus: Zeilen loeschen.
  - name: Anthropic News
    url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_news.xml
    webhook: DISCORD_WEBHOOK_ALLGEMEIN
    fetch_full: true      # Feed liefert keinen Textkoerper

  - name: Google DeepMind Blog
    url: https://deepmind.google/blog/feed/basic/
    webhook: DISCORD_WEBHOOK_ALLGEMEIN
    fetch_full: true      # Feed liefert keinen Textkoerper

  - name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
    webhook: DISCORD_WEBHOOK_ALLGEMEIN
    max_age_days: 7          # Feed enthaelt den kompletten Blogverlauf

  - name: Simon Willison
    url: https://simonwillison.net/atom/everything/
    webhook: DISCORD_WEBHOOK_ALLGEMEIN
    max_per_run: 2

  - name: arXiv cs.AI
    url: https://rss.arxiv.org/rss/cs.AI
    webhook: DISCORD_WEBHOOK_ALLGEMEIN
    max_per_run: 2
    max_age_days: 3

  - name: heise KI
    url: https://www.heise.de/rss/heise-atom.xml
    webhook: DISCORD_WEBHOOK_ALLGEMEIN
    keywords: [KI, "Künstliche Intelligenz", LLM, OpenAI, Anthropic, Gemini, Sprachmodell]

  # ---------- SAP ----------
  # Diese vier haben im Lauf vom 12.09. sauber geparst.
  - name: SAP Community AI Blogs
    url: https://community.sap.com/khhcw49343/rss/board?board.id=aiblog-board
    webhook: DISCORD_WEBHOOK_SAP

  - name: SAP Community Technology (by SAP)
    url: https://community.sap.com/khhcw49343/rss/board?board.id=technology-blog-sap
    webhook: DISCORD_WEBHOOK_SAP
    max_per_run: 3

  - name: SAP News Center
    url: https://news.sap.com/feed/
    webhook: DISCORD_WEBHOOK_SAP

  - name: SAPinsider Blogs
    url: https://sapinsider.org/type/blogs/feed/
    webhook: DISCORD_WEBHOOK_SAP

  # ---------- IT-Security im KI-Kontext ----------
  # Fuer diese drei ist KI-Sicherheit das Kernthema, daher ohne Filter.
  - name: Embrace The Red
    url: https://embracethered.com/blog/index.xml
    webhook: DISCORD_WEBHOOK_SECURITY

  - name: OWASP GenAI Security
    url: https://genai.owasp.org/feed/
    webhook: DISCORD_WEBHOOK_SECURITY

  - name: Adversa AI
    url: https://adversa.ai/feed/
    webhook: DISCORD_WEBHOOK_SECURITY
    max_per_run: 2
    fetch_full: true      # Feed liefert nur Anreisser

  # Breite Security-Forschung: nur Eintraege mit KI-Bezug durchlassen.
  - name: Trail of Bits
    url: https://blog.trailofbits.com/feed/
    webhook: DISCORD_WEBHOOK_SECURITY
    keywords: *ai_security

  - name: Google Project Zero
    url: https://googleprojectzero.blogspot.com/feeds/posts/default
    webhook: DISCORD_WEBHOOK_SECURITY
    keywords: *ai_security

  - name: PortSwigger Research
    url: https://portswigger.net/research/rss
    webhook: DISCORD_WEBHOOK_SECURITY
    keywords: *ai_security
    fetch_full: true

  - name: Unit 42
    url: https://unit42.paloaltonetworks.com/feed/
    webhook: DISCORD_WEBHOOK_SECURITY
    keywords: *ai_security
    fetch_full: true

  - name: Cisco Talos
    url: https://blog.talosintelligence.com/rss/
    webhook: DISCORD_WEBHOOK_SECURITY
    keywords: *ai_security
    fetch_full: true
