name: news

on:
  schedule:
    - cron: "17 5-21/2 * * *"  # alle 2 Stunden zwischen 05:17 und 21:17 UTC
  workflow_dispatch:           # Knopf zum manuellen Ausloesen

permissions:
  contents: write              # noetig, um state/seen.json zurueckzuschreiben

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # Auf Commit-SHA gepinnt statt auf den Tag: Tags sind verschiebbar, ein
      # uebernommenes Action-Repo koennte v5 auf anderen Code zeigen lassen.
      # Kommentar nennt die Version, damit man weiss, was der SHA ist.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        run: pytest -q

      - name: Feeds verarbeiten
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DISCORD_WEBHOOK_ALLGEMEIN: ${{ secrets.DISCORD_WEBHOOK_ALLGEMEIN }}
          DISCORD_WEBHOOK_SAP: ${{ secrets.DISCORD_WEBHOOK_SAP }}
          DISCORD_WEBHOOK_SECURITY: ${{ secrets.DISCORD_WEBHOOK_SECURITY }}
        run: python summarize.py

      - name: Stand und Archiv zurueckschreiben
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state/seen.json archive

          if git diff --staged --quiet; then
            echo "Keine Aenderungen, nichts zu committen."
            exit 0
          fi
          git commit -m "state: $(date -u +%F\ %H:%M)"

          # Wird zwischen Checkout und hier von aussen gepusht, lehnt GitHub
          # unseren Push ab. Ohne Wiederholung bliebe der Stand ungespeichert
          # und alle Meldungen gingen im naechsten Lauf erneut raus.
          for versuch in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push abgelehnt (Versuch $versuch), hole Remote-Stand nach."
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "Rebase fehlgeschlagen - Stand nicht gespeichert." >&2
              exit 1
            fi
          done
          echo "Push nach 3 Versuchen fehlgeschlagen." >&2
          exit 1
