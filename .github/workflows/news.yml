name: news

on:
  schedule:
    - cron: "17 5-21 * * *"   # stuendlich zwischen 05:17 und 21:17 UTC
  workflow_dispatch:           # Knopf zum manuellen Ausloesen

permissions:
  contents: write              # noetig, um state/seen.json zurueckzuschreiben

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser requests pyyaml

      - name: Feeds verarbeiten
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DISCORD_WEBHOOK_ALLGEMEIN: ${{ secrets.DISCORD_WEBHOOK_ALLGEMEIN }}
          DISCORD_WEBHOOK_SAP: ${{ secrets.DISCORD_WEBHOOK_SAP }}
        run: python summarize.py

      - name: Stand zurueckschreiben
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --staged --quiet || git commit -m "state: $(date -u +%F\ %H:%M)"
          git push
